name: Release

# Tag a version to publish it:
#
#   npm version 0.2.1 --no-git-tag-version   # updates package.json
#   # bump "version" in manifest.json and add it to versions.json
#   git commit -am "Release 0.2.1" && git tag 0.2.1 && git push --tags
#
# Obsidian expects bare version tags ("0.2.1"), not "v0.2.1".

on:
  push:
    tags:
      - "*.*.*"
  workflow_dispatch:

permissions:
  contents: write
  # Build provenance attestations: id-token to sign, attestations to
  # record. Obsidian's directory review checks for these so users can
  # verify main.js was built from this repo rather than uploaded by hand.
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Test and build
        run: |
          npm test
          npm run build

      - name: Check the tag matches manifest.json
        # A release whose manifest disagrees with its tag installs as the
        # wrong version and never updates cleanly, so fail loudly here.
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          MANIFEST=$(node -p "require('./manifest.json').version")
          echo "tag=$TAG manifest=$MANIFEST"
          if [ "$TAG" != "$MANIFEST" ]; then
            echo "::error::Tag $TAG does not match manifest.json version $MANIFEST"
            exit 1
          fi
          if ! node -p "require('./versions.json')['$TAG']" >/dev/null 2>&1; then
            echo "::error::versions.json has no entry for $TAG"
            exit 1
          fi

      - name: Attest build provenance
        # Must run after the build and before the release, so the digests
        # attested are the exact bytes attached below.
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            main.js
            manifest.json
            styles.css

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          # Below 1.0.0 the title says BETA, but the release is a normal
          # one. It must NOT be marked --prerelease: GitHub excludes
          # prereleases from /releases/latest, and Obsidian resolves a
          # plugin's download that way — so a prerelease 0.x reads to it
          # as "no release matches your manifest version" even when the
          # tag, the assets and the manifest all agree. The BETA label
          # carries the same warning to a human without hiding the
          # release from the scanner.
          TITLE="$TAG"
          case "$TAG" in
            0.*) TITLE="$TAG BETA" ;;
          esac
          # main.js is a build artifact and is gitignored, so it only
          # reaches users by being attached here.
          gh release create "$TAG" \
            --title "$TITLE" \
            --generate-notes \
            --latest \
            main.js manifest.json styles.css
